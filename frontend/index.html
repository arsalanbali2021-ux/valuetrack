<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueTrack — Login</title>
    <meta name="description" content="ValueTrack Smart Financial & Insurance Management System. Login or register to manage your finances.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <span class="material-symbols-outlined">account_balance_wallet</span>
                </div>
                <h1>ValueTrack</h1>
                <p>Smart Financial & Insurance Management</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-target="loginSection">Login</button>
                <button class="auth-tab" data-target="registerSection">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginSection" class="auth-form active">
                <div id="loginAlert"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input class="form-input" type="email" id="loginEmail"
                               placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input class="form-input" type="password" id="loginPassword"
                               placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full btn-lg">
                        <span class="material-symbols-outlined">login</span>
                        Sign In
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerSection" class="auth-form">
                <div id="registerAlert"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="registerName">Full Name</label>
                        <input class="form-input" type="text" id="registerName"
                               placeholder="Alice Johnson" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerEmail">Email</label>
                        <input class="form-input" type="email" id="registerEmail"
                               placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Password</label>
                        <input class="form-input" type="password" id="registerPassword"
                               placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerConfirm">Confirm Password</label>
                        <input class="form-input" type="password" id="registerConfirm"
                               placeholder="Re-enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full btn-lg">
                        <span class="material-symbols-outlined">person_add</span>
                        Create Account
                    </button>
                </form>
            </div>

            <p style="text-align:center; margin-top:1.5rem; font-size:0.75rem; color:var(--color-text-muted);">
                Academic Project — B.Tech Mini Project
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
