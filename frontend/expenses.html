<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses – ValueTrack</title>
    <link rel="icon" href="img/logo.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page">
        <div class="page-title">
            <h1>Expenses</h1>
            <p>Write down what you spend. Mark rent, bills and subscriptions as fixed so you can tell them apart from day-to-day spending.</p>
        </div>

        <div class="cols cols-wide-left">
            <section class="sheet">
                <div class="sheet-head"><h2>Add an expense</h2></div>
                <div id="expenseAlert"></div>
                <form id="expenseForm">
                    <div class="fields fields-2">
                        <div class="field">
                            <label for="amount">Amount</label>
                            <div class="with-unit">
                                <span class="unit left">₹</span>
                                <input class="form-input" type="number" id="amount" step="0.01" min="0.01" placeholder="450" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="expenseDate">Date</label>
                            <input class="form-input" type="date" id="expenseDate" required>
                        </div>
                        <div class="field">
                            <label for="category">Category</label>
                            <select class="form-select" id="category" required>
                                <option value="">Choose…</option>
                                <option value="Food">Food</option>
                                <option value="Groceries">Groceries</option>
                                <option value="Rent">Rent</option>
                                <option value="Transport">Transport</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Subscriptions">Subscriptions</option>
                                <option value="Education">Education</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="description">What was it for?</label>
                            <input class="form-input" type="text" id="description" placeholder="Lunch at the canteen">
                        </div>
                    </div>
                    <div class="form-actions" style="justify-content:space-between;">
                        <label class="check">
                            <input type="checkbox" id="isFixed">
                            <span>Fixed expense <span class="form-help">comes every month, like rent or a phone bill</span></span>
                        </label>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            </section>

            <section class="sheet">
                <div class="sheet-head">
                    <h2>Monthly budget</h2>
                    <button type="button" class="link-btn" id="editBudgetBtn">Change</button>
                </div>
                <div id="budgetDisplay">
                    <div class="big-figure" id="budgetSpent" style="font-size:1.6rem;">—</div>
                    <p class="month-note" id="budgetNote"></p>
                    <div class="meter">
                        <div class="meter-fill" id="budgetBar"></div>
                        <div class="meter-mark" title="75% of budget"></div>
                    </div>
                    <div class="meter-scale"><span>₹0</span><span>75%</span><span id="budgetMax">—</span></div>
                </div>
                <form id="budgetEditor" class="lookup hidden">
                    <div class="field">
                        <label for="budgetInput">Budget for a month</label>
                        <div class="with-unit">
                            <span class="unit left">₹</span>
                            <input type="number" id="budgetInput" class="form-input" min="0" step="100" placeholder="20000">
                        </div>
                    </div>
                    <button type="submit" id="saveBudgetBtn" class="btn">Save</button>
                </form>
            </section>
        </div>

        <section class="sheet flush ledger" style="margin-top:1.5rem;">
            <div class="sheet-head">
                <h2>Ledger</h2>
                <div style="display:flex; gap:0.5rem;">
                    <select class="form-select" id="filterMonth" aria-label="Month" style="width:auto;">
                        <option value="">All months</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select class="form-select" id="filterYear" aria-label="Year" style="width:auto;">
                        <option value="">All years</option>
                    </select>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Particulars</th>
                            <th>Category</th>
                            <th class="num">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="expenseListBody">
                        <tr><td colspan="4" class="empty">Loading…</td></tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" id="totalLabel">Total</td>
                            <td class="num" id="totalAmount">—</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/expenses.js"></script>
</body>
</html>
